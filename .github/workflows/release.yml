name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  build_extension:
    runs-on: ubuntu-latest
    if: "contains(github.event.head_commit.message, '[build extension]')"
    permissions:
      contents: write # Needed to create releases and tags
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Fetch all history for git tags

      - name: Calculate new version
        id: versioning
        run: |
          LATEST_TAG=$(git describe --tags --match "extension-v*" --abbrev=0 2>/dev/null || echo "extension-v0.0.0")
          VERSION_NUMBER=${LATEST_TAG#extension-v}
          NEW_VERSION=$(echo $VERSION_NUMBER | awk -F. -v OFS=. '{$NF++;print}')
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "new_version_tag=extension-v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update package.json
        run: |
          npm version ${{ env.NEW_VERSION }} --no-git-tag-version --prefix plugin

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build VS Code Extension
        run: |
          chmod +x build/build_extension.sh
          ./build/build_extension.sh
      
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.versioning.outputs.new_version_tag }}
          release_name: Extension Release v${{ env.NEW_VERSION }}
          draft: false
          prerelease: false
          
      - name: Upload Extension to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build/dist/refactor-extension.vsix
          asset_name: refactor-extension-v${{ env.NEW_VERSION }}.vsix
          asset_content_type: application/vsix

  build_app:
    runs-on: macos-latest
    if: "contains(github.event.head_commit.message, '[build app]')"
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Calculate new version
        id: versioning_app
        run: |
          LATEST_TAG=$(git describe --tags --match "app-v*" --abbrev=0 2>/dev/null || echo "app-v0.0.0")
          VERSION_NUMBER=${LATEST_TAG#app-v}
          NEW_VERSION=$(echo $VERSION_NUMBER | awk -F. -v OFS=. '{$NF++;print}')
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "new_version_tag=app-v$NEW_VERSION" >> $GITHUB_OUTPUT
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies and Build App
        run: |
          pip install -r app/requirements.txt
          chmod +x build/build_app.sh
          ./build/build_app.sh
      
      - name: Create Release
        id: create_release_app
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.versioning_app.outputs.new_version_tag }}
          release_name: App Release v${{ env.NEW_VERSION }}
          draft: false
          prerelease: false

      - name: Zip the .app
        id: zip_app
        run: |
          ARCHIVE_PATH="build/dist/RefactorApp-macOS-v${{ env.NEW_VERSION }}.zip"
          ditto -c -k --sequesterRsrc --keepParent build/dist/RefactorApp.app "$ARCHIVE_PATH"
          echo "asset_path=$ARCHIVE_PATH" >> $GITHUB_OUTPUT

      - name: Upload App to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release_app.outputs.upload_url }}
          asset_path: ${{ steps.zip_app.outputs.asset_path }}
          asset_name: RefactorApp-macOS-v${{ env.NEW_VERSION }}.zip
          asset_content_type: application/zip 